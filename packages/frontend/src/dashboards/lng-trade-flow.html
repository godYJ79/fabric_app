<title>LNG 수출입 현황</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
/* Layout: 왼쪽은 3D 지구본/평면 지도(유리 질감 컨트롤이 위에 뜸), 오른쪽은 조회 패널(검색·기간·목록·월별 차트). 좁은 화면에서는 위아래로 쌓는다 */
:root {
  --bg: #e6edf2; --sea: #d3e0ea; --land: #aebfce; --border: #eef3f7;
  --ink: #12303f; --ink-soft: #5b7686; --muted: #898781;
  --panel: rgba(250, 252, 253, 0.86); --panel-line: rgba(18, 48, 63, 0.12);
  --card: #fcfcfb; --field: #ffffff;
  --accent: #0b5c80; --accent-ink: #ffffff;
  --arc: #0b5c80; --sel: #0d3b57; --tint: #86a9c0;
  --grid: #e1e0d9; --axis: #c3c2b7;
  --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a; --s4: #eda100; --s5: #9a9892;
  --font-ui: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  --font-data: "JetBrains Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0b141b; --sea: #12212c; --land: #28414f; --border: #0f1c25;
    --ink: #e4eef4; --ink-soft: #8aa3b3; --muted: #898781;
    --panel: rgba(16, 29, 39, 0.86); --panel-line: rgba(228, 238, 244, 0.14);
    --card: #16222b; --field: #0f1a22;
    --accent: #59b6e0; --accent-ink: #08202d;
    --arc: #7cc8ec; --sel: #3f9fcf; --tint: #2c5a76;
    --grid: #2c2c2a; --axis: #383835;
    --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500; --s5: #7a7974;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0b141b; --sea: #12212c; --land: #28414f; --border: #0f1c25;
  --ink: #e4eef4; --ink-soft: #8aa3b3; --muted: #898781;
  --panel: rgba(16, 29, 39, 0.86); --panel-line: rgba(228, 238, 244, 0.14);
  --card: #16222b; --field: #0f1a22;
  --accent: #59b6e0; --accent-ink: #08202d;
  --arc: #7cc8ec; --sel: #3f9fcf; --tint: #2c5a76;
  --grid: #2c2c2a; --axis: #383835;
  --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500; --s5: #7a7974;
  color-scheme: dark;
}
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font-ui); font-size: 14px; overflow: hidden; }
.app { display: grid; grid-template-columns: minmax(0, 1fr) 372px; height: 100%; }
.stage { position: relative; min-width: 0; min-height: 0; }
#map { position: absolute; inset: 0; background: var(--bg); }
#map canvas { outline: none; }
.ui { position: absolute; z-index: 5; }
.panel { background: var(--panel); border: 1px solid var(--panel-line); border-radius: 12px; backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); box-shadow: 0 6px 24px rgba(10, 30, 45, 0.12); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
button { font: inherit; color: var(--ink); cursor: pointer; }
.top { top: 12px; left: max(12px, env(safe-area-inset-left, 0px)); right: 64px; display: flex; flex-wrap: wrap; gap: 8px; align-items: stretch; }
.title { margin: 0; padding: 0 16px; display: flex; align-items: center; font-size: 15px; font-weight: 600; letter-spacing: -0.01em; }
.seg { display: flex; padding: 4px; gap: 2px; }
.seg button, .btn { background: transparent; border: 0; border-radius: 8px; padding: 7px 12px; white-space: nowrap; }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); font-weight: 600; }
.seg button:hover:not([aria-pressed="true"]), .btn:hover { background: var(--panel-line); }
.btn.panel { padding: 0 14px; }
.zoom { top: 12px; right: 12px; display: flex; flex-direction: column; overflow: hidden; }
.zoom button { background: transparent; border: 0; width: 40px; height: 40px; padding: 0; font-size: 20px; }
.zoom button + button { border-top: 1px solid var(--panel-line); }
.key { left: max(12px, env(safe-area-inset-left, 0px)); bottom: 12px; padding: 10px 14px; font-size: 12px; color: var(--ink-soft); display: grid; gap: 6px; }
.key div { display: flex; align-items: center; gap: 8px; }
.key i { display: inline-block; flex: none; }
.key .k-sel { width: 14px; height: 14px; border-radius: 50%; background: var(--arc); opacity: 0.35; border: 2px solid var(--arc); box-sizing: border-box; }
.key .k-par { width: 10px; height: 10px; border-radius: 50%; background: var(--card); border: 2px solid var(--arc); box-sizing: border-box; margin: 0 2px; }
.key .k-line { width: 14px; height: 3px; background: var(--arc); border-radius: 2px; margin: 0 0 0 0; }
.credit { right: 12px; bottom: 10px; font-size: 11px; color: var(--ink-soft); text-align: right; pointer-events: none; }

/* 오른쪽 조회 패널 */
.side { background: var(--card); border-left: 1px solid var(--panel-line); overflow-y: auto; min-height: 0; padding-block: 14px 18px; padding-left: 16px; padding-right: max(16px, env(safe-area-inset-right, 0px)); display: flex; flex-direction: column; gap: 12px; }
.search { display: flex; gap: 0; }
.search input { flex: 1; min-width: 0; font: inherit; color: var(--ink); background: var(--field); border: 1px solid var(--panel-line); border-right: 0; border-radius: 8px 0 0 8px; padding: 8px 10px; }
.search button { background: var(--accent); color: var(--accent-ink); border: 1px solid var(--accent); border-radius: 0 8px 8px 0; padding: 0 16px; font-weight: 600; }
.msg { margin: -6px 0 0; min-height: 1em; font-size: 12px; color: var(--ink-soft); }
.msg.err { color: #c0392b; }
:root[data-theme="dark"] .msg.err { color: #ff8a80; }
.ctl { display: grid; grid-template-columns: auto 1fr; align-items: center; gap: 8px 12px; }
.ctl > span { font-size: 12px; color: var(--ink-soft); }
.tog { display: inline-flex; border: 1px solid var(--panel-line); border-radius: 999px; padding: 2px; width: max-content; }
.tog button { border: 0; background: transparent; border-radius: 999px; padding: 4px 14px; font-size: 13px; }
.tog button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); font-weight: 600; }
.period { display: flex; align-items: center; gap: 6px; min-width: 0; }
.period input { width: 82px; min-width: 0; font: inherit; font-size: 13px; color: var(--ink); background: var(--field); border: 1px solid var(--panel-line); border-radius: 6px; padding: 5px 8px; text-align: center; font-variant-numeric: tabular-nums; }
.favs { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
.fav { border: 1px solid var(--panel-line); background: transparent; border-radius: 999px; padding: 4px 12px; font-size: 13px; }
.fav[aria-pressed="true"] { border-color: var(--accent); }
.fav b { font-weight: 500; margin-left: 4px; color: var(--accent); }
.chip { border: 0; background: var(--panel-line); border-radius: 999px; padding: 3px 10px; font-size: 12px; }
.sec { margin: 4px 0 0; display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
.sec h2 { margin: 0; font-size: 16px; font-weight: 600; }
.sec .sub { font-size: 12px; color: var(--ink-soft); text-align: right; }
.cnt { margin: -8px 0 0; font-size: 12px; color: var(--ink-soft); }
.tablewrap { max-height: 218px; overflow: auto; border: 1px solid var(--panel-line); border-radius: 8px; }
table { border-collapse: collapse; width: 100%; font-size: 13px; }
th, td { padding: 7px 10px; text-align: left; border-bottom: 1px solid var(--grid); }
thead th { position: sticky; top: 0; background: var(--card); font-weight: 600; font-size: 12px; color: var(--ink-soft); z-index: 1; border-bottom: 1px solid var(--axis); }
td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
tbody tr:last-child td { border-bottom: 0; }
tbody tr:hover, tbody tr:focus-visible, tbody tr.on { background: var(--panel-line); outline: none; }
.empty { padding: 18px 12px; font-size: 13px; color: var(--ink-soft); text-align: center; }
.chart-head { display: flex; align-items: center; justify-content: space-between; margin-top: 6px; }
.chart-head h2 { margin: 0; font-size: 16px; font-weight: 600; }
.link { background: transparent; border: 1px solid var(--panel-line); border-radius: 6px; padding: 3px 10px; font-size: 12px; color: var(--ink-soft); }
.viz { position: relative; }
.viz svg { display: block; width: 100%; height: auto; overflow: visible; }
.viz text { font-family: var(--font-ui); fill: var(--muted); font-size: 11px; }
.seg-m { transition: filter 0.1s; }
.seg-m.hot { filter: brightness(1.14); }
.tip { position: absolute; pointer-events: none; z-index: 3; background: var(--card); color: var(--ink); border: 1px solid var(--panel-line); border-radius: 8px; box-shadow: 0 4px 16px rgba(10, 30, 45, 0.18); padding: 6px 9px; font-size: 12px; white-space: nowrap; }
.tip .tm { color: var(--ink-soft); margin-bottom: 2px; }
.tip .tr { display: flex; align-items: center; gap: 6px; }
.tip .tr i { width: 10px; height: 3px; border-radius: 2px; flex: none; }
.tip .tr b { font-weight: 600; font-variant-numeric: tabular-nums; }
.tip .tr span { color: var(--ink-soft); }
.legend { display: flex; flex-wrap: wrap; gap: 4px 14px; margin-top: 8px; font-size: 12px; color: var(--ink-soft); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { width: 10px; height: 10px; border-radius: 2px; display: inline-block; }
.note { margin: 0; font-size: 11px; color: var(--ink-soft); line-height: 1.5; }
.chart-table { max-height: 240px; }

@media (max-width: 860px) {
  body { overflow: auto; }
  .app { display: block; height: auto; }
  .stage { height: 64vh; min-height: 420px; }
  .side { border-left: 0; border-top: 1px solid var(--panel-line); overflow: visible; padding-left: max(16px, env(safe-area-inset-left, 0px)); }
  .credit { display: none; }
  .title { padding: 8px 14px; }
  .key { display: none; }
}
</style>

<div class="app">
  <div class="stage" id="stage">
    <div id="map" role="application" aria-label="LNG 수출입 지도"></div>
    <div class="ui top">
      <h1 class="panel title">LNG 수출입 현황</h1>
      <div class="panel seg" role="group" aria-label="지도 보기">
        <button id="m-globe" type="button" aria-pressed="true">3D 지구본</button>
        <button id="m-flat" type="button" aria-pressed="false">평면 지도</button>
      </div>
      <button id="fit" class="btn panel" type="button">전체 보기</button>
    </div>
    <div class="ui panel zoom">
      <button id="zin" type="button" aria-label="확대">+</button>
      <button id="zout" type="button" aria-label="축소">−</button>
      <button id="reset" type="button" aria-label="시점 초기화">⟳</button>
    </div>
    <div class="ui panel key" aria-hidden="true">
      <div><i class="k-sel"></i>선택한 국가</div>
      <div><i class="k-par"></i>상대 국가</div>
      <div><i class="k-line"></i>선 굵기는 기간 합계 물량</div>
    </div>
    <div class="ui credit">샘플 데이터입니다. 실제 Kpler 통계가 아닙니다.<br>국가 경계: Natural Earth (world-atlas)</div>
  </div>

  <aside class="side" aria-label="LNG 조회">
    <form id="q" autocomplete="off" novalidate style="display:contents">
      <div class="search">
        <input id="qin" list="countries" placeholder="국가 검색 (예: 미국)" aria-label="국가 검색" spellcheck="false">
        <button id="qbtn" type="submit">조회</button>
      </div>
      <datalist id="countries"></datalist>
      <p id="qmsg" class="msg" role="status"></p>
      <div class="ctl">
        <span>유형</span>
        <div class="tog" role="group" aria-label="유형">
          <button id="t-in" type="button" aria-pressed="false">수입</button>
          <button id="t-out" type="button" aria-pressed="true">수출</button>
        </div>
        <span>조회 기간</span>
        <div class="period">
          <input id="pfrom" inputmode="numeric" maxlength="7" placeholder="YYYY.MM" aria-label="조회 시작월 (YYYY.MM)">
          <span aria-hidden="true">~</span>
          <input id="pto" inputmode="numeric" maxlength="7" placeholder="YYYY.MM" aria-label="조회 종료월 (YYYY.MM)">
        </div>
        <span>즐겨찾기</span>
        <div class="favs"><button id="fav" class="fav" type="button" aria-pressed="false"><span id="favlab">즐겨찾기</span><b id="favstar">☆</b></button><span id="favlist" class="favs"></span></div>
      </div>
    </form>

    <div class="sec"><h2 id="ttl">LNG 수출량</h2><span class="sub" id="sum"></span></div>
    <p class="cnt" id="cnt"></p>
    <div class="tablewrap" id="tw"></div>

    <div class="chart-head"><h2 id="cttl">월별 수출 물량</h2><button id="vt" class="link" type="button" aria-pressed="false">표로 보기</button></div>
    <div class="viz" id="viz"></div>
    <div class="legend" id="legend"></div>
    <p class="note">단위: 백만 톤(MT). 상위 4개국은 전체 기간(2024.11~2026.10) 합계 순위로 색을 고정해, 기간을 바꿔도 같은 국가는 같은 색입니다. 당월(M) 값은 추정치를 가정한 샘플입니다.</p>
  </aside>
</div>

        parameters: state.globe ? { depthTest: false } : {},

        getPosition: d => flat ? [d.p[0], d.p[1], 1500000] : d.p,
        getSize: 13, sizeUnits: 'pixels',
        getColor: d => d.k === state.sel ? col('--accent-ink') : col('--ink'),
        background: true,
        getBackgroundColor: d => d.k === state.sel ? col('--accent') : [...rgb(css('--card')), 238],
        backgroundPadding: [7, 4, 7, 4],
        getBorderColor: [...rgb(css('--ink')), 50], getBorderWidth: 1,
        fontFamily: '"IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif',
        fontWeight: 500, characterSet: 'auto',
        getTextAnchor: 'middle', getAlignmentBaseline: 'bottom', getPixelOffset: [0, -10],
        updateTriggers: { getPosition: [state.globe], getColor: [theme, state.sel], getBackgroundColor: [theme, state.sel], getText: [favs.join()] }
      })
    ]
  });
}
function getTooltip({ object, layer }) {
  if (object && layer && layer.id === 'land') {
    const n = object.properties.n, k = Object.keys(C).find(c => C[c][4] === n);
    return { text: k ? C[k][0] + ' (클릭하여 조회)' : n, style: { fontFamily: 'IBM Plex Sans KR, sans-serif', fontSize: '12px', borderRadius: '8px', padding: '6px 10px' } };
  }
  if (!object || !layer || layer.id !== 'flows') return null;
  return {
    text: `${C[object.a][0]} → ${C[object.b][0]}\n${fmt(object.v)} MT (${MONTHS[state.from]} ~ ${MONTHS[state.to]})`,
    style: { fontFamily: 'IBM Plex Sans KR, sans-serif', fontSize: '12px', borderRadius: '8px', padding: '6px 10px' }
  };
}

/* ---------- 오른쪽 패널 ---------- */
// 파트너 색은 '선택 국가 + 유형의 12개월 전체 순위' 기준으로 고정해서, 기간을 바꿔도 같은 국가는 같은 색을 유지한다
function seriesFor() {
  const out = state.type === 'out';
  const all = PAIRS.filter(p => (out ? p.a : p.b) === state.sel).map(p => ({ k: out ? p.b : p.a, m: p.m, tot: sum(p.m, 0, N - 1) })).sort((x, y) => y.tot - x.tot);
  const top = all.slice(0, 4), rest = all.slice(4);
  const series = top.map((s, i) => ({ k: s.k, name: C[s.k][0], color: 'var(--s' + (i + 1) + ')', m: s.m }));
  if (rest.length) series.push({ k: '_', name: '기타', color: 'var(--s5)', m: MONTHS.map((_, i) => rest.reduce((a, r) => a + r.m[i], 0)) });
  return series;
}
function renderTable() {
  const tw = $('tw'); tw.textContent = '';
  if (!cur.list.length) {
    const d = document.createElement('div'); d.className = 'empty';
    const other = PAIRS.some(p => (state.type === 'out' ? p.b : p.a) === state.sel);
    d.textContent = C[state.sel][0] + '의 ' + MONTHS[state.from] + ' ~ ' + MONTHS[state.to] + ' LNG ' + tname() + ' 데이터가 없습니다.' + (other ? ' ' + (state.type === 'out' ? '수입' : '수출') + '으로 바꿔 보세요.' : '');
    tw.appendChild(d); return;
  }
  const t = document.createElement('table');
  t.innerHTML = '<thead><tr><th>권역</th><th>국가</th><th class="num">물량</th></tr></thead>';
  const tb = document.createElement('tbody');
  cur.list.forEach(f => {
    const tr = document.createElement('tr'); tr.tabIndex = 0; tr.dataset.k = f.partner;
    [[C[f.partner][3], ''], [C[f.partner][0], ''], [fmt(f.v) + ' MT', 'num']].forEach(([txt, cls]) => { const td = document.createElement('td'); td.textContent = txt; if (cls) td.className = cls; tr.appendChild(td); });
    const on = () => { state.hl = f.partner; tr.classList.add('on'); drawSoon(); };
    const off = () => { state.hl = null; tr.classList.remove('on'); drawSoon(); };
    tr.addEventListener('pointerenter', on); tr.addEventListener('pointerleave', off);
    tr.addEventListener('focus', on); tr.addEventListener('blur', off);
    tb.appendChild(tr);
  });
  t.appendChild(tb); tw.appendChild(t);
}

let asTable = false;
const niceTicks = max => { // 0부터 4칸 눈금
  const raw = max / 4, p = Math.pow(10, Math.floor(Math.log10(raw))), f = raw / p;
  const step = (f <= 1 ? 1 : f <= 2 ? 2 : f <= 2.5 ? 2.5 : f <= 5 ? 5 : 10) * p;
  return { step, max: step * 4 };
};
function renderChart() {
  const box = $('viz'); box.textContent = '';
  const idx = []; for (let i = state.from; i <= state.to; i++) idx.push(i);
  const series = seriesFor();
  const lg = $('legend'); lg.textContent = '';
  series.forEach(s => { const sp = document.createElement('span'); const i = document.createElement('i'); i.style.background = s.color; sp.appendChild(i); sp.appendChild(document.createTextNode(s.name)); lg.appendChild(sp); });
  if (!series.length) { const d = document.createElement('div'); d.className = 'empty'; d.textContent = '표시할 데이터가 없습니다.'; box.appendChild(d); return; }
  if (asTable) {
    const w = document.createElement('div'); w.className = 'tablewrap chart-table';
    const t = document.createElement('table');
    const hr = '<thead><tr><th>월</th>' + series.map(() => '<th class="num"></th>').join('') + '<th class="num">합계</th></tr></thead>';
    t.innerHTML = hr;
    [...t.querySelectorAll('th.num')].forEach((th, i) => { th.textContent = i < series.length ? series[i].name : '합계'; });
    const tb = document.createElement('tbody');
    idx.forEach(i => {
      const tr = document.createElement('tr'); const cells = [MONTHS[i], ...series.map(s => fmt(s.m[i])), fmt(series.reduce((a, s) => a + s.m[i], 0))];
      cells.forEach((c, j) => { const td = document.createElement('td'); td.textContent = c; if (j) td.className = 'num'; tr.appendChild(td); });
      tb.appendChild(tr);
    });
    t.appendChild(tb); w.appendChild(t); box.appendChild(w); return;
  }
  const W = Math.max(box.clientWidth, 260), H = 210, ml = 36, mr = 6, mt = 24, mb = 24;
  const totals = idx.map(i => series.reduce((a, s) => a + s.m[i], 0));
  const { step, max } = niceTicks(Math.max(...totals, 0.1));
  const y = v => mt + (H - mt - mb) * (1 - v / max);
  const band = (W - ml - mr) / idx.length, bw = Math.min(24, band * 0.62);
  const NS = 'http://www.w3.org/2000/svg';
  const el = (n, a, p) => { const e = document.createElementNS(NS, n); Object.entries(a).forEach(([k, v]) => e.setAttribute(k, v)); if (p) p.appendChild(e); return e; };
  const svg = el('svg', { viewBox: `0 0 ${W} ${H}`, role: 'img', 'aria-label': $('cttl').textContent + ' 누적 막대 차트' }, box);
  el('text', { x: 0, y: 10 }, svg).textContent = '(MT)';
  for (let k = 0; k <= 4; k++) {
    const v = step * k, yy = y(v);
    el('line', { x1: ml, x2: W - mr, y1: yy, y2: yy, stroke: k === 0 ? 'var(--axis)' : 'var(--grid)', 'stroke-width': 1 }, svg);
    const tx = el('text', { x: ml - 6, y: yy + 4, 'text-anchor': 'end' }, svg); tx.textContent = (step < 1 ? v.toFixed(2).replace(/0$/, '') : String(+v.toFixed(1)));
  }
  const tip = document.createElement('div'); tip.className = 'tip'; tip.hidden = true; box.appendChild(tip);
  const showTip = (e, i, s) => {
    tip.textContent = '';
    const m = document.createElement('div'); m.className = 'tm'; m.textContent = MONTHS[i] + ' · 합계 ' + fmt(totals[idx.indexOf(i)]) + ' MT'; tip.appendChild(m);
    const r = document.createElement('div'); r.className = 'tr';
    const ik = document.createElement('i'); ik.style.background = s.color; const b = document.createElement('b'); b.textContent = fmt(s.m[i]) + ' MT';
    const nm = document.createElement('span'); nm.textContent = s.name; r.append(ik, b, nm); tip.appendChild(r);
    tip.hidden = false;
    const br = box.getBoundingClientRect(); let x = e.clientX - br.left + 12, yy = e.clientY - br.top - 44;
    if (x + tip.offsetWidth > br.width) x = e.clientX - br.left - tip.offsetWidth - 12;
    tip.style.left = Math.max(0, x) + 'px'; tip.style.top = Math.max(0, yy) + 'px';
  };
  idx.forEach((i, j) => {
    const cx = ml + band * (j + 0.5), x0 = cx - bw / 2;
    if (idx.length <= 12 || j % 2 === 0) el('text', { x: cx, y: H - 6, 'text-anchor': 'middle' }, svg).textContent = mshort(MONTHS[i]);
    let cum = 0; const segs = series.map(s => { const v = s.m[i], y1 = y(cum + v), y0 = y(cum); cum += v; return { s, v, y1, y0 }; });
    const topIdx = segs.map(g => g.v > 0).lastIndexOf(true);
    segs.forEach((g, n) => {
      if (g.v <= 0) return;
      const h = Math.max(0, g.y0 - g.y1 - (n === 0 ? 0 : 2)); if (h <= 0) return;
      const r = 4, yt = g.y1;
      let node;
      if (n === topIdx && h > r) node = el('path', { d: `M${x0},${yt + h} L${x0},${yt + r} Q${x0},${yt} ${x0 + r},${yt} L${x0 + bw - r},${yt} Q${x0 + bw},${yt} ${x0 + bw},${yt + r} L${x0 + bw},${yt + h} Z`, fill: g.s.color }, svg);
      else node = el('rect', { x: x0, y: yt, width: bw, height: h, fill: g.s.color }, svg);
      node.setAttribute('class', 'seg-m');
      const hit = el('rect', { x: cx - band / 2, y: g.y1, width: band, height: Math.max(g.y0 - g.y1, 6), fill: 'transparent', tabindex: 0, 'aria-label': `${MONTHS[i]} ${g.s.name} ${fmt(g.v)} MT` }, svg);
      const on = e => { node.classList.add('hot'); showTip(e, i, g.s); };
      const off = () => { node.classList.remove('hot'); tip.hidden = true; };
      hit.addEventListener('pointermove', on); hit.addEventListener('pointerleave', off);
      hit.addEventListener('focus', () => { const b = hit.getBoundingClientRect(), p = box.getBoundingClientRect(); on({ clientX: b.left + b.width / 2 - 20, clientY: b.top + 30 }); }); hit.addEventListener('blur', off);
    });
  });
}

function renderPanel() {
  const nm = C[state.sel][0];
  $('ttl').textContent = 'LNG ' + tname() + '량';
  $('cttl').textContent = '월별 ' + tname() + ' 물량';
  $('sum').textContent = nm + ' · ' + MONTHS[state.from] + ' ~ ' + MONTHS[state.to] + (cur.list.length ? ' · 합계 ' + fmt(cur.total) + ' MT' : '');
  $('cnt').textContent = '전체 ' + cur.list.length + '개';
  $('t-in').setAttribute('aria-pressed', String(state.type === 'in'));
  $('t-out').setAttribute('aria-pressed', String(state.type === 'out'));
  $('qin').value = nm; $('pfrom').value = MONTHS[state.from]; $('pto').value = MONTHS[state.to];
  const isFav = favs.includes(state.sel);
  $('fav').setAttribute('aria-pressed', String(isFav)); $('favstar').textContent = isFav ? '★' : '☆';
  $('favlab').textContent = isFav ? '즐겨찾기 해제' : '즐겨찾기 추가';
  const fl = $('favlist'); fl.textContent = '';
  favs.forEach(k => { const b = document.createElement('button'); b.type = 'button'; b.className = 'chip'; b.textContent = '★ ' + C[k][0]; b.onclick = () => { state.sel = k; refresh(true); }; fl.appendChild(b); });
  renderTable(); renderChart();
}
function refresh(recenter) {
  cur = query(); state.hl = null;
  renderPanel(); draw();
  if (recenter) animateTo(homeVS(state.globe), 600);
}

/* ---------- 입력 처리 ---------- */
const dl = $('countries'); Object.values(C).map(c => c[0]).sort((a, b) => a.localeCompare(b, 'ko')).forEach(n => { const o = document.createElement('option'); o.value = n; dl.appendChild(o); });
const setMsg = (t, err) => { const m = $('qmsg'); m.textContent = t || ''; m.className = 'msg' + (err ? ' err' : ''); };
function parseYM(s) {
  const m = String(s).trim().match(/^(\d{4})\D?(\d{1,2})$/); if (!m) return -1;
  return MONTHS.indexOf(m[1] + '.' + String(+m[2]).padStart(2, '0'));
}
function findCountry(q) {
  q = q.replace(/\s+/g, ''); if (!q) return null;
  const all = Object.entries(C);
  const exact = all.find(([, c]) => c[0] === q); if (exact) return exact[0];
  const part = all.filter(([, c]) => c[0].includes(q)); return part.length === 1 ? part[0][0] : (part.length > 1 ? 'many' : null);
}
function applySel(k) {
  state.sel = k;
  // 선택한 유형에 데이터가 없고 반대 유형에는 있으면 자동으로 전환해서 빈 화면을 피한다
  const has = t => PAIRS.some(p => (t === 'out' ? p.a : p.b) === k);
  setMsg('');
  if (!has(state.type) && has(state.type === 'out' ? 'in' : 'out')) {
    state.type = state.type === 'out' ? 'in' : 'out';
    setMsg(C[k][0] + '은(는) ' + tname() + ' 데이터만 있어 ' + tname() + '으로 전환했습니다.');
  }
}
$('q').addEventListener('submit', e => {
  e.preventDefault();
  const k = findCountry($('qin').value);
  if (k === null) { setMsg('"' + $('qin').value.trim() + '"에 해당하는 국가가 없습니다. 목록에서 골라 주세요.', true); return; }
  if (k === 'many') { setMsg('검색어와 일치하는 국가가 여러 개입니다. 국가명을 더 자세히 입력해 주세요.', true); return; }
  const a = parseYM($('pfrom').value), b = parseYM($('pto').value);
  if (a < 0 || b < 0) { setMsg('조회 기간은 YYYY.MM 형식으로 ' + MONTHS[0] + ' ~ ' + MONTHS[N - 1] + ' 안에서 입력해 주세요.', true); return; }
  if (a > b) { setMsg('시작월이 종료월보다 늦습니다.', true); return; }
  setMsg('');
  state.from = a; state.to = b;
  applySel(k);
  refresh(true);
});
$('t-in').onclick = () => { if (state.type !== 'in') { state.type = 'in'; setMsg(''); refresh(true); } };
$('t-out').onclick = () => { if (state.type !== 'out') { state.type = 'out'; setMsg(''); refresh(true); } };
$('fav').onclick = () => { const i = favs.indexOf(state.sel); if (i >= 0) favs.splice(i, 1); else favs.push(state.sel); saveFavs(); renderPanel(); draw(); };
$('vt').onclick = () => { asTable = !asTable; $('vt').setAttribute('aria-pressed', String(asTable)); $('vt').textContent = asTable ? '차트로 보기' : '표로 보기'; renderChart(); };
$('qin').addEventListener('focus', e => e.target.select());

/* ---------- 지도 조작 ---------- */
function home() { animateTo(homeVS(state.globe), 400); }
function setMode(globe) {
  state.globe = globe;
  $('m-globe').setAttribute('aria-pressed', String(globe));
  $('m-flat').setAttribute('aria-pressed', String(!globe));
  anim++;
  vs = homeVS(globe);
  dk.setProps({ views: globe ? globeView : flatView, viewState: toDeck(vs) });
  draw();
}
$('map').addEventListener('wheel', e => {
  e.preventDefault();
  const unit = e.deltaMode === 1 ? 33 : (e.deltaMode === 2 ? 400 : 1);       // 줄/페이지 단위 입력을 픽셀로 환산
  const dy = clamp(e.deltaY * unit, -80, 80);                                  // 한 번에 너무 크게 튀지 않게 제한
  const k = e.ctrlKey ? 0.012 : 0.004;                                         // 트랙패드 핀치는 ctrlKey가 켜져 들어온다
  anim++;
  vs = { ...vs, zoom: clamp(vs.zoom - dy * k, 0, 6) };
  applyView(); drawSoon();
}, { passive: false });
const zoomBy = d => animateTo({ ...vs, zoom: clamp(vs.zoom + d, 0, 6) }, 250);
$('m-globe').onclick = () => setMode(true);
$('m-flat').onclick = () => setMode(false);
$('zin').onclick = () => zoomBy(0.7);
$('zout').onclick = () => zoomBy(-0.7);
$('reset').onclick = home;
$('fit').onclick = home;

/* ---------- 테마 · 크기 변화 ---------- */
const redraw = () => { renderChart(); draw(); };
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', redraw);
new MutationObserver(redraw).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });
if (document.fonts && document.fonts.ready) document.fonts.ready.then(draw);
let rw = 0;
new ResizeObserver(() => { const w = $('viz').clientWidth; if (Math.abs(w - rw) > 2) { rw = w; renderChart(); } }).observe($('viz'));
renderPanel(); draw();
</script>
